<!-- ══════════════════════════════════════════════════════════════════════
     iOS / iPad 专用 meta。每一条都有具体理由，不是模板抄来的：

     viewport-fit=cover
       让页面铺到 iPhone/iPad 的圆角与 Home 指示条区域。
       不用它的话，安全区之外是黑边；用了它才能配合
       env(safe-area-inset-*) 把 UI 摆到安全区内。

     user-scalable=no + maximum-scale=1
       iPad Safari 默认允许双指缩放与双击放大。游戏里这会让
       "点卡片"偶尔变成"放大页面"，而且放大后坐标映射全乱。
       ⚠️ 光靠这个 meta 在 iOS 上**不总是生效**，所以 shell.js 里
          同时拦了 gesturestart / dblclick（双保险）。

     apple-mobile-web-app-capable + status-bar-style
       从主屏幕启动时全屏（去掉 Safari 地址栏），否则顶部会一直占一条，
       横屏时那条地址栏会让画面上下都缺一块。

     apple-mobile-web-app-title
       加到主屏幕后的名字。
     ═══════════════════════════════════════════════════════════════ -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" data-page-node-id="boetkCtwaAqc8NifYRXGTc">
<meta name="apple-mobile-web-app-capable" content="yes" data-page-node-id="dHblAJtErj3RoZLjOzcPiG">
<meta name="mobile-web-app-capable" content="yes" data-page-node-id="6W6C5KAc5FTHHS1olXOevE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-page-node-id="AOwrnkLd3nh4CrYFNzRbhX">
<meta name="apple-mobile-web-app-title" content="植物大战僵尸" data-page-node-id="kck78OC70jxXDb94ABqbyU">
<meta name="theme-color" content="#0f1a12" data-page-node-id="BLmHCvyIIYDwbKckT7mC2a">
<meta name="format-detection" content="telephone=no" data-page-node-id="3SGFgVcpbZ2O5c12DZ08uE">

<!-- ─────────────── 加载遮罩 ───────────────
     首次进入要下约 50MB 资源（贴图 + 音效）。
     没有进度反馈的话玩家会以为"卡住了"直接退出。
     #bootBtn 同时也是**音频解锁按钮** —— iOS 要求
     "用户手势之后"才能创建/恢复 AudioContext，
     没有这一步全程静音。 -->
<div id="boot" class="boot" data-page-node-id="wTGSD3Wl3nSKz515t2Hxf1">
  <div class="boot-card" data-page-node-id="OL9h4V4GLdi6UYRziljnnZ">
    <h1 class="boot-title" data-page-node-id="WDdFO7NnGDPEgaJXlOjbVY">植物大战僵尸</h1>
    <p class="boot-sub" data-page-node-id="qzdbRcuJ0EQE3kQWNondKV">C 语言复刻版 · 网页版</p>

    <div id="bootProgWrap" class="boot-prog" hidden data-page-node-id="M9jcgFPWeu4yUZ22cfq5GP">
      <div id="bootProgBar" class="boot-prog-bar" data-page-node-id="Ks4WxiHpTHEYfYpVUnJeFB"></div>
    </div>
    <p id="bootMsg" class="boot-msg" data-page-node-id="qDYDuWqkZmbXelUjQyIF7g">准备中…</p>

    <button id="bootBtn" class="boot-btn" disabled data-page-node-id="qoejeHoZ01WIEvIt8JgBYk">载入中…</button>
    <p id="bootHint" class="boot-hint" data-page-node-id="iCkonhOJBAIKInGoCXia8E"></p>
  </div>
</div>

<!-- ─────────────── 竖屏提示 ───────────────
     游戏 UI 是按横向 1000×650 设计的。竖屏仍可玩（按宽度铺满），
     但会局促 —— 所以给一个**可关闭**的提示，而不是直接禁用。
     关掉之后不再出现（本次会话内）。 -->
<div id="rotateHint" class="rotate-hint" hidden data-page-node-id="Dq9j9BG1olV54ByOcUuBKR">
  <div class="rotate-card" data-page-node-id="to3Amz7sCTSJQBHbb5GmBH">
    <div class="rotate-icon" data-page-node-id="eB7ZlbfAZexjCdyPnY80ID">⟳</div>
    <p class="rotate-title" data-page-node-id="PH8gN8FgVVG5irk0EmfAw5">横屏体验更好</p>
    <p class="rotate-desc" data-page-node-id="ueWfynGVjm6tfRBdAcoVI2">把 iPad 横过来，画面会铺满整屏</p>
    <div class="rotate-actions" data-page-node-id="6OrjtzLHbGy6I4nQwmhMvy">
      <button id="rotateOk" class="rb rb-primary" data-page-node-id="N3NSu0FcuHMMatbG3fWjx0">知道了</button>
      <button id="rotatePlay" class="rb" data-page-node-id="qA0OWb8oI1tsFnc8C6NGiH">竖屏继续玩</button>
    </div>
  </div>
</div>

<!-- ─────────────── 游戏画布 ───────────────
     canvas 的**像素尺寸**恒为 2000×1300（= 引擎世界层，逻辑 1000×650 × SS 2），
     **显示尺寸**由 CSS 按"等比铺满 + 居中"算。
     这样 iPad 各种分辨率（1180×820 / 1194×834 / 1366×1024）都不用改引擎，
     缩放交给浏览器的 GPU 合成 —— 见 shell.js 的 layout()。 -->
<div id="stage" class="stage" data-page-node-id="zKxTzCe8GI93yIajSaQzBZ">
  <canvas id="screen" width="2000" height="1300" data-page-node-id="hFoOA99KnHNnXbfgJLLPQa"></canvas>
</div>

<!-- ─────────────── 屏幕快捷键 ───────────────
     桌面端用键盘：空格=暂停 / W=落雷 / M=天气 / E=特效 / 1-8=编组 / F=全屏。
     iPad 没键盘，所以把这几个最常用的做成按钮。
     ⚠️ 走的是**同一个** handleKey()（见 pvz.c 的注释），
        不是另写一套逻辑 —— 否则桌面按键与屏幕按钮的行为迟早会分叉。
     位置固定在左下角、避开安全区。 -->
<nav id="keys" class="keys" hidden data-page-node-id="0N2xxG5As1zG6LDYfqJrKA">
  <button class="kb" data-key="32"  title="暂停 / 继续" data-page-node-id="2vH5sUokkNocgSxWjrDFsG">⏸</button>
  <button class="kb" data-key="87"  title="落雷（W）" data-page-node-id="RGGjfSlYsavHsp8FV0Mhq9">⚡</button>
  <button class="kb" data-key="77"  title="切换天气（M）" data-page-node-id="PFB7k5S380HyIP9uuRhxwi">☁</button>
  <button class="kb" data-key="69"  title="切换特效（E）" data-page-node-id="u5sy066EnEQULFehiVBalR">✨</button>
  <button class="kb" data-key="70"  title="全屏（F）" data-page-node-id="b1Mp2ZA1DB3jAZBC3dXVXf">⛶</button>
</nav>
