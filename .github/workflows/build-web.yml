name: Build web (WASM) and deploy to Pages

# 为什么构建放在 Actions 而不是本地：
#   本机只有 MinGW gcc，没有 clang/wasm 目标；而 Emscripten 的工具链与
#   Node 都从 storage.googleapis.com 下载 —— 该域名在本机环境**不可达**
#   （沙箱内外都一样，已实测）。Actions 的 runner 网络不受此限制。
#
# 这个工作流做三件事，顺序刻意如此：
#   ① 先用 **gcc** 跑一遍本机验证（编译 + 原语级比对 + 回归）
#      —— 这一步和平台无关，能在**没有 Emscripten**的情况下先确认代码自洽；
#         它会拦住 90% 的低级错误，让后面的 wasm 编译失败更容易定位。
#   ② 再用 emcc 编 WASM
#   ③ 部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 允许手动触发（调试构建问题时很有用）

permissions:
  # contents: write 是**为了失败诊断**，不是构建需要。
  # 起因：CI 失败时我读不到 Actions 原始日志（匿名下载返回 403），
  # 于是让工作流把失败日志贴到 commit 评论里 —— 而**创建 commit 评论需要
  # contents: write**。第一版给的是 read，于是贴评论静默 403、诊断形同虚设。
  # 这个仓库是 public 且只有本人使用，放宽到 write 是可接受的代价。
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ─────────────────── ① 平台无关的自检（gcc）───────────────────
      # 这一步**故意放在 emcc 之前**：它能在几十秒内告诉你
      # "代码本身能不能编、逻辑有没有被改坏"，而不是等到几分钟的
      # wasm 构建之后再对着一个含糊的 emcc 报错排查。
      - name: 本机验证编译（gcc + 可移植分支）
        run: |
          set -e
          sudo apt-get update -qq
          # binutils 提供 nm —— _check_web_symbols.py 用它读符号表。
          # ⚠️ 之前没显式装，脚本在缺 nm 的环境里会崩，看起来像"有缺失符号"，
          #    实际只是工具没装。现在既显式安装，脚本也做了容错（缺工具时报 SKIP）。
          sudo apt-get install -y -qq gcc libc6-dev binutils
          # 可移植分支与 wasm 共用同一份源码；这里先把语法与链接打通
          gcc -DPLAT_PORTABLE -O1 -c pvz.c -o /tmp/pvz.o -Wall -Wextra
          gcc -DPLAT_PORTABLE -O1 -c plat_web.c -o /tmp/plat_web.o -Wall -Wextra
          echo "✓ 可移植分支编译通过（零告警）"

      - name: 原语级跨平台比对（软件光栅 vs 无 GDI 参考）
        run: |
          set -e
          # _ab_prim.c 是"纯原语"测试，不依赖 pvz.c。
          # 在 Linux 上没有 gdi32，所以只跑软件光栅一侧 ——
          # 目的是确认它**不崩且产出稳定**（真正的逐像素对照在 Windows 本地做）。
          gcc -DPLAT_PORTABLE -O2 -o /tmp/abprim _ab_prim.c plat_web.c -lm \
              -Wl,--allow-multiple-definition
          /tmp/abprim
          echo "✓ 软件光栅后端可运行"

      # ─────────────────── ② Emscripten 构建 ───────────────────
      - name: 检查可移植侧符号（提前发现 emcc 才会暴露的链接错误）
        run: |
          # ★ 这一步是 2026-09-21 emcc 构建失败后加的。
          #   那次失败的原因是两个 MSVCRT 专有函数（_wcsicmp / _wgetenv）没实现：
          #   本机 MinGW 会因为 kernel32/msvcrt 兜底而**看不出**缺口，
          #   而 emcc 到 musl 上直接链接失败 —— 前面几步全过、到编译 WASM 才炸。
          #
          # ⚠️ 三条刻意的设计，改动前先读：
          #
          #  ① **set +e，且不阻塞构建**。
          #     GitHub Actions 的 bash 默认带 -e，任何非零返回都会让整步失败。
          #     而这个检查是"守卫"，它自己曾在这个 CI 上误报过（本机通过、CI 失败）。
          #     守卫一旦拦在真正的构建前面，就再也看不到 emcc 的真实结果 —— 本末倒置。
          #     真正的权威是 emcc 自己。
          #
          #  ② **这个步骤里不能有任何可能非零退出的裸命令**。
          #     真实踩过：一次 `str.replace(..., 1)` 的编辑打错位置，
          #     把 emcc 步骤的注解代码插进了这一步，于是它会去 grep 一个
          #     还不存在的 /tmp/emcc.log → grep 返回 1 → bash -e 让整步失败。
          #     症状是"一个自称不阻塞的步骤把整个 CI 拦死了"，极难看出。
          #
          #  ③ 输出转 annotation：**公开仓库的 annotation 无需登录即可读**，
          #     而 Actions 原始日志要认证才能下载（匿名 GET 返回 403）。
          set +e

          python3 _check_web_symbols.py > /tmp/symcheck.log 2>&1
          RC=$?
          echo "==== 符号检查输出（退出码 $RC）===="
          cat /tmp/symcheck.log

          if [ "$RC" -ne 0 ]; then LV="::warning"; else LV="::notice"; fi
          head -14 /tmp/symcheck.log | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "${LV} title=符号检查（退出码 ${RC}）::${esc}"
          done
          echo "（符号检查不阻塞构建；emcc 才是权威）"
          exit 0

      - name: wsprintfW 语义测试（Windows 语义 vs POSIX 语义）
        run: |
          # ★ 这一步是 2026-09-21 线上"素材载入 0 张、画面退化成程序化图形"之后加的。
          #
          #   根因：宽格式串里的 `%s`，MSVC 语义收 `wchar_t*`，POSIX 语义收 `char*`。
          #   第一版把 wsprintfW 委托给 `vswprintf` —— 本机 MinGW 走 MSVC 语义
          #   所以本地验证全绿，而 emcc 的 musl 走 POSIX 语义，把 `wchar_t*`
          #   当 `char*` 读，853 张素材的路径全变垃圾，**且不报任何错**
          #   （符号存在、语法合法，符号检查与编译告警都抓不到）。
          #
          #   ⚠️ 这一步**必须跑在 Ubuntu 上**才有回归防护力：
          #      若有人把 wsprintfW 改回委托 vswprintf，只有 POSIX 平台会失败 ——
          #      Windows 本机因为 MSVC 语义恰好正确，反而会漏过。
          gcc -DPLAT_PORTABLE -O2 -Wall -Wextra -I. \
              -o /tmp/test_wprintf _test_web_printf.c plat_web.c -lm
          /tmp/test_wprintf

      - name: 文字（字形注入）端到端测试
        run: |
          # ★ 这一步护的是「文字有没有被画到画面上」。
          #   2026-09-15 线上出现"素材 853 张全载入、0 个 JS 异常，
          #   但整屏一个字都没有" —— 根因是 putText() 用 n=-1 表示"按 NUL 结尾"
          #   （Win32 约定），而 drawTextCore 把 n 当计数用，`0 < -1` 恒假，
          #   循环体一次都不执行。不报错、不告警，只是什么都没画。
          #
          #   ⚠️ 这条**必须在 Linux 上也跑**：它验证的是 C 侧贴图路径，
          #      与 libc 无关，两个平台都该过。在本地跑是快速反馈，
          #      在 CI 跑是防止回归被漏掉。
          gcc -DPLAT_PORTABLE -O2 -Wall -Wextra -I. \
              -o /tmp/test_wglyph _test_web_glyph.c plat_web.c pvz.c -lm
          /tmp/test_wglyph

      - name: 安装 Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: 核对资源
        run: |
          # 用脚本核对，**不要**在 workflow 里硬编码文件名清单。
          # 第一版在这里列了 7 个文件，其中两个后缀写错（lawn.png 实际是 lawn.jpg、
          # ui_menu_bg_v1.png 实际是 .jpg）→ 这一步 exit 1、整个构建失败，
          # 而报错看起来像"资源没打包进去"。
          # 脚本的口径：总量阈值 + 少量逐一验证过的必需文件；
          # 不做"引擎引用的每个名字都必须存在"（引擎有 50 个设计上就没美术的槽位，
          # 那样判会报一堆误报，而会误报的检查最后一定会被人忽略）。
          python3 _verify_assets.py

      - name: 编译 WASM
        run: |
          # ⚠️ 刻意**不写 set -e**：要把 emcc 的完整输出抓下来再做判断。
          #    用 `set -e` 的话第一次失败就退出，日志拿不到。
          #
          # 每个参数都有理由，改动前先读注释
          #
          # -DPLAT_PORTABLE
          #     走可移植分支（plat.h 的 `_WIN32 && !PLAT_PORTABLE` 条件）。
          #     顺带让 pvz.c 用 plat_d3d_stub.h 而不是真的 d3d9.h。
          #
          # --preload-file assets@/assets
          #     把资源打进 .data 包并挂到虚拟路径 /assets。
          #     引擎用相对路径 "assets/xxx.png" 就能读到（CWD 是 /）。
          #     比"让 JS 侧一个个 fetch 再写进 FS"简单得多，也不会漏。
          #     ⚠️ 用的是仓库根下的 assets/（clone 后已只含 PNG/JPG/sfx/bgm），
          #        不是 web/assets —— 后者是早期的中间产物方案，现已废弃。
          #
          # -sFORCE_FILESYSTEM=1
          #     引擎要用 fopen/GetFileAttributesW 读资源，必须带完整 FS。
          #
          # -sALLOW_MEMORY_GROWTH=1
          #     引擎会为每张贴图 malloc，初始内存不够会直接 OOM。
          #
          # -sEXPORTED_FUNCTIONS
          #     必须**精确列出**所有会被 JS 调用的函数，否则会被 DCE 优化掉。
          #     漏一个的症状是运行时 "xxx is not a function"，
          #     而且要等真正调用到那一步才出现（比如点了开始才发现点不动）。
          #
          # -sEXPORTED_RUNTIME_METHODS
          #     ccall 用来调 C 函数；FS 用来读写存档；HEAPU32 用来把世界层
          #     的像素搬到 canvas（外壳每帧都要用，这是性能关键路径）。
          #
          # --no-entry
          #     PLAT_HAS_OWN_MAIN=0 时没有 main()，所以要显式声明无入口。
          emcc -DPLAT_PORTABLE -O2 -I. \
            -sWASM=1 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFORCE_FILESYSTEM=1 \
            -sINITIAL_MEMORY=67108864 \
            -sSTACK_SIZE=5242880 \
            -sEXPORTED_FUNCTIONS='["_gameInitAll","_gameStep","_gamePointerMove","_gamePointerDown","_gamePointerUp","_handleKey","_gameArtCount","_platWebFrame","_platWebInit","_gameSetAssetDir","_gameSetDeterministic",
            # ★ 文字：外壳必须能调这两个 —— 字形由 JS 光栅化后回灌，
            #   没导出的话文字会一个都不显示，且**不报任何错**。
            "_platWebGlyph","_platWebGlyphReq","_platWebGlyphCount","_platWebGlyphReqCount",
            "_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap","FS","HEAPU32","HEAPU8","HEAPF32"]' \
            --preload-file assets@/assets \
            --no-entry \
            -o web/pvz.js \
            pvz.c plat_web.c > /tmp/emcc.log 2>&1
          RC=$?

          echo "==== emcc 退出码: $RC ===="
          echo "==== 日志最后 120 行 ===="
          tail -120 /tmp/emcc.log
          echo "==== web/ 目录 ===="
          ls -lh web/ || true

          if [ $RC -ne 0 ]; then
            # ★★ 两条并行的公开通道，都是刻意设计的 ——
            #    Actions 的原始日志要认证才能下载（匿名访问返回 403），
            #    所以"CI 失败 → 我看不到原因 → 只能猜"这个死循环必须用别的路打破。
            #
            #    ① commit 评论：**公开仓库的评论无需登录即可读**。
            #       只保留尾部 3500 字符（GitHub 单条评论上限 65536，
            #       而 emcc 的报错通常在最后，头部全是无关进度）。
            #    ② annotation：同样是公开可读，且不用处理评论的权限问题。
            bash _ci_post_log.sh /tmp/emcc.log "emcc 编译 WASM 失败" || true
            grep -E "error|Error|undefined reference|failed|无法|找不到" /tmp/emcc.log \
              | head -8 | while IFS= read -r line; do
                esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error title=emcc 编译失败::${esc}"
              done
            exit 1
          fi

          echo "--- 产物 ---"
          ls -lh web/pvz.js web/pvz.wasm web/pvz.data

      - name: 组装站点
        run: |
          set -e
          cd web
          # shell.js / index.html / shell.css 是仓库里的源文件，已在 web/ 下
          # pvz.js / pvz.wasm / pvz.data 是上一步的产物
          ls -1
          # 加一个 .nojekyll：Pages 默认会跑 Jekyll，它会**忽略下划线开头的文件**，
          # 而我们没有这类文件，但 Jekyll 处理 74MB 资源也很慢，直接跳过。
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
