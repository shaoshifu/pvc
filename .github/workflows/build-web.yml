name: Build web (WASM) and deploy to Pages

# 为什么构建放在 Actions 而不是本地：
#   本机只有 MinGW gcc，没有 clang/wasm 目标；而 Emscripten 的工具链与
#   Node 都从 storage.googleapis.com 下载 —— 该域名在本机环境**不可达**
#   （沙箱内外都一样，已实测）。Actions 的 runner 网络不受此限制。
#
# 这个工作流做三件事，顺序刻意如此：
#   ① 先用 **gcc** 跑一遍本机验证（编译 + 原语级比对 + 回归）
#      —— 这一步和平台无关，能在**没有 Emscripten**的情况下先确认代码自洽；
#         它会拦住 90% 的低级错误，让后面的 wasm 编译失败更容易定位。
#   ② 再用 emcc 编 WASM
#   ③ 部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 允许手动触发（调试构建问题时很有用）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ─────────────────── ① 平台无关的自检（gcc）───────────────────
      # 这一步**故意放在 emcc 之前**：它能在几十秒内告诉你
      # "代码本身能不能编、逻辑有没有被改坏"，而不是等到几分钟的
      # wasm 构建之后再对着一个含糊的 emcc 报错排查。
      - name: 本机验证编译（gcc + 可移植分支）
        run: |
          set -e
          sudo apt-get update -qq
          # binutils 提供 nm —— _check_web_symbols.py 用它读符号表。
          # ⚠️ 之前没显式装，脚本在缺 nm 的环境里会崩，看起来像"有缺失符号"，
          #    实际只是工具没装。现在既显式安装，脚本也做了容错（缺工具时报 SKIP）。
          sudo apt-get install -y -qq gcc libc6-dev binutils
          # 可移植分支与 wasm 共用同一份源码；这里先把语法与链接打通
          gcc -DPLAT_PORTABLE -O1 -c pvz.c -o /tmp/pvz.o -Wall -Wextra
          gcc -DPLAT_PORTABLE -O1 -c plat_web.c -o /tmp/plat_web.o -Wall -Wextra
          echo "✓ 可移植分支编译通过（零告警）"

      - name: 原语级跨平台比对（软件光栅 vs 无 GDI 参考）
        run: |
          set -e
          # _ab_prim.c 是"纯原语"测试，不依赖 pvz.c。
          # 在 Linux 上没有 gdi32，所以只跑软件光栅一侧 ——
          # 目的是确认它**不崩且产出稳定**（真正的逐像素对照在 Windows 本地做）。
          gcc -DPLAT_PORTABLE -O2 -o /tmp/abprim _ab_prim.c plat_web.c -lm \
              -Wl,--allow-multiple-definition
          /tmp/abprim
          echo "✓ 软件光栅后端可运行"

      # ─────────────────── ② Emscripten 构建 ───────────────────
      - name: 检查可移植侧符号（提前发现 emcc 才会暴露的链接错误）
        run: |
          # ★ 这一步是 2026-09-21 emcc 构建失败后加的。
          #   那次失败的原因是 `_wcsicmp` / `_wgetenv` 两个 MSVCRT 专有函数没实现：
          #   本机 MinGW 会因为 kernel32/msvcrt 兜底而**看不出**缺口，
          #   而 emcc 到 musl 上直接链接失败。
          #   于是前面 6 步全过、到第 7 步才炸，而且日志要认证才能下载、只能猜。
          #   现在这一步会在十几秒内指名道姓地报出来。
          if ! python3 _check_web_symbols.py > /tmp/symcheck.log 2>&1; then
            cat /tmp/symcheck.log
            # 失败时把日志贴到 commit 评论 —— Actions 原始日志要认证才能下载（403），
            # 而公开仓库的评论无需登录即可读，于是"失败但看不到原因"的死循环被打破。
            bash _ci_post_log.sh /tmp/symcheck.log "可移植侧符号检查失败"
            exit 1
          fi
          cat /tmp/symcheck.log

      - name: 安装 Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: 核对资源
        run: |
          # 用脚本核对，**不要**在 workflow 里硬编码文件名清单。
          # 第一版在这里列了 7 个文件，其中两个后缀写错（lawn.png 实际是 lawn.jpg、
          # ui_menu_bg_v1.png 实际是 .jpg）→ 这一步 exit 1、整个构建失败，
          # 而报错看起来像"资源没打包进去"。
          # 脚本的口径：总量阈值 + 少量逐一验证过的必需文件；
          # 不做"引擎引用的每个名字都必须存在"（引擎有 50 个设计上就没美术的槽位，
          # 那样判会报一堆误报，而会误报的检查最后一定会被人忽略）。
          python3 _verify_assets.py

      - name: 编译 WASM
        run: |
          # ⚠️ 刻意**不写 set -e**：要把 emcc 的完整输出抓下来再做判断。
          #    用 `set -e` 的话第一次失败就退出，日志拿不到。
          #
          # 每个参数都有理由，改动前先读注释
          #
          # -DPLAT_PORTABLE
          #     走可移植分支（plat.h 的 `_WIN32 && !PLAT_PORTABLE` 条件）。
          #     顺带让 pvz.c 用 plat_d3d_stub.h 而不是真的 d3d9.h。
          #
          # --preload-file assets@/assets
          #     把资源打进 .data 包并挂到虚拟路径 /assets。
          #     引擎用相对路径 "assets/xxx.png" 就能读到（CWD 是 /）。
          #     比"让 JS 侧一个个 fetch 再写进 FS"简单得多，也不会漏。
          #     ⚠️ 用的是仓库根下的 assets/（clone 后已只含 PNG/JPG/sfx/bgm），
          #        不是 web/assets —— 后者是早期的中间产物方案，现已废弃。
          #
          # -sFORCE_FILESYSTEM=1
          #     引擎要用 fopen/GetFileAttributesW 读资源，必须带完整 FS。
          #
          # -sALLOW_MEMORY_GROWTH=1
          #     引擎会为每张贴图 malloc，初始内存不够会直接 OOM。
          #
          # -sEXPORTED_FUNCTIONS
          #     必须**精确列出**所有会被 JS 调用的函数，否则会被 DCE 优化掉。
          #     漏一个的症状是运行时 "xxx is not a function"，
          #     而且要等真正调用到那一步才出现（比如点了开始才发现点不动）。
          #
          # -sEXPORTED_RUNTIME_METHODS
          #     ccall 用来调 C 函数；FS 用来读写存档；HEAPU32 用来把世界层
          #     的像素搬到 canvas（外壳每帧都要用，这是性能关键路径）。
          #
          # --no-entry
          #     PLAT_HAS_OWN_MAIN=0 时没有 main()，所以要显式声明无入口。
          emcc -DPLAT_PORTABLE -O2 -I. \
            -sWASM=1 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFORCE_FILESYSTEM=1 \
            -sINITIAL_MEMORY=67108864 \
            -sSTACK_SIZE=5242880 \
            -sEXPORTED_FUNCTIONS='["_gameInitAll","_gameStep","_gamePointerMove","_gamePointerDown","_gamePointerUp","_handleKey","_gameArtCount","_platWebFrame","_platWebInit","_gameSetAssetDir","_gameSetDeterministic","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap","FS","HEAPU32","HEAPU8","HEAPF32"]' \
            --preload-file assets@/assets \
            --no-entry \
            -o web/pvz.js \
            pvz.c plat_web.c > /tmp/emcc.log 2>&1
          RC=$?

          echo "==== emcc 退出码: $RC ===="
          echo "==== 日志最后 120 行 ===="
          tail -120 /tmp/emcc.log
          echo "==== web/ 目录 ===="
          ls -lh web/ || true

          if [ $RC -ne 0 ]; then
            # ★★ 把失败日志贴到 commit 评论里 —— **这是刻意设计的**。
            #    Actions 的原始日志要认证才能下载（匿名访问返回 403），
            #    而**公开仓库的 commit 评论是无需登录就能读的**。
            #    于是"CI 失败 → 我看不到原因 → 只能猜"这个死循环被打破：
            #    贴到评论里之后，我（以及任何协作者）都能直接读到 emcc 的报错。
            #    只保留尾部 3500 字符：GitHub 单条评论上限 65536，
            #    而 emcc 的错误通常在最后，头部全是无关的编译进度。
            bash _ci_post_log.sh /tmp/emcc.log "emcc 编译 WASM 失败"
            exit 1
          fi

          echo "--- 产物 ---"
          ls -lh web/pvz.js web/pvz.wasm web/pvz.data

      - name: 组装站点
        run: |
          set -e
          cd web
          # shell.js / index.html / shell.css 是仓库里的源文件，已在 web/ 下
          # pvz.js / pvz.wasm / pvz.data 是上一步的产物
          ls -1
          # 加一个 .nojekyll：Pages 默认会跑 Jekyll，它会**忽略下划线开头的文件**，
          # 而我们没有这类文件，但 Jekyll 处理 74MB 资源也很慢，直接跳过。
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
